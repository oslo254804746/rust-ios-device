[package]
name = "ios-py"
description = "Python bindings (PyO3) for the rust-ios-device library"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
keywords = ["ios", "apple", "python", "mobile", "usbmuxd"]
categories = ["api-bindings", "development-tools::ffi"]

[features]
# Host-side Cargo tests link PyO3 to the active Python runtime. Wheel builds
# enable this feature through pyproject.toml so the extension can resolve
# Python symbols at import time.
default = []
extension-module = ["pyo3/extension-module"]

[lib]
name = "ios_rs"
crate-type = ["cdylib"]

[dependencies]
ios-core  = { workspace = true, features = ["mdns", "tunnel-userspace"] }
pyo3      = { workspace = true, features = ["abi3-py39"] }
tokio     = { workspace = true, features = ["rt-multi-thread"] }
