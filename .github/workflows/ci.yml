name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-tag:
    name: Validate tag matches workspace version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag version matches Cargo.toml
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -nE 's/^version *= *"([^"]+)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match workspace version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Tag version ($TAG_VERSION) matches workspace version"

  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-bin: false

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify release gate topology
        uses: astral-sh/setup-uv@v5

      - name: Check release gate negative evidence
        run: |
          uv run --with pyyaml python scripts/check-release-gates.py
          uv run --with pyyaml python scripts/test_check_release_gates.py

  feature-check:
    name: Feature subset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-bin: false

      - name: Check no-default-features
        run: cargo check -p ios-core --no-default-features

      - name: Check feature classic
        run: cargo check -p ios-core --features classic

      - name: Check feature developer
        run: cargo check -p ios-core --features developer

      - name: Check feature ios17
        run: cargo check -p ios-core --features ios17

      - name: Check feature management
        run: cargo check -p ios-core --features management

  msrv:
    name: MSRV (1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-bin: false

      - name: Check workspace compiles on MSRV
        run: cargo check --workspace --exclude ios-py

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev headers (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      # macOS: OpenSSL is available via Homebrew (pre-installed on GitHub runners).
      # Windows: OpenSSL is installed through the runner-provided vcpkg.

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg install openssl:x64-windows-static-md

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-bin: false

      - name: Build
        run: cargo build --workspace --exclude ios-py

      - name: Test
        shell: bash
        run: |
          cargo test --workspace --exclude ios-core --exclude ios-py
          cargo test -p ios-core --all-features

  python-smoke:
    name: Python binding (host + wheel smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native and Python development headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config python3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v5

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-bin: false

      - name: Run host-side Rust tests
        env:
          PYO3_PYTHON: /usr/bin/python3
        run: |
          # The workspace gate excludes the packaging-only extension-module
          # feature; test the binding separately against the host Python ABI.
          cargo test --workspace --no-run --exclude ios-py
          cargo test -p ios-py --no-default-features

      - name: Build abi3 wheel
        env:
          PYO3_PYTHON: /usr/bin/python3
        run: |
          cd crates/ios-py
          uvx maturin build --release --out ../../dist

      - name: Import wheel and validate Python error contract
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl
          .venv/bin/python - <<'PY'
          import ios_rs

          assert callable(ios_rs.list_devices)
          try:
              ios_rs.start_tunnel("no-such-device", mode="invalid")
          except ValueError as exc:
              message = str(exc)
              assert "userspace" in message and "kernel" in message
          else:
              raise AssertionError("invalid tunnel mode must raise ValueError")
          PY

  release:
    name: Release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, feature-check, msrv, build-and-test, validate-tag]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            lib_ext: so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
            lib_ext: so
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            lib_ext: dylib
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            lib_ext: dll

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev headers (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg install openssl:x64-windows-static-md

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: release-${{ matrix.target }}
          cache-bin: false

      - name: Build release binary + FFI library
        run: cargo build --release --package ios-cli --package ios-ffi --target ${{ matrix.target }}

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package CLI (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="target/${{ matrix.target }}/release"
          [ -s "$RELEASE_DIR/ios" ] || { echo "::error::CLI binary missing or empty: target=${{ matrix.target }} path=$RELEASE_DIR/ios"; exit 1; }
          ASSET_NAME="ios-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar czf "$ASSET_NAME" -C "$RELEASE_DIR" ios
          echo "CLI_ASSET=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Package CLI (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="target/${{ matrix.target }}/release"
          [ -s "$RELEASE_DIR/ios.exe" ] || { echo "::error::CLI binary missing or empty: target=${{ matrix.target }} path=$RELEASE_DIR/ios.exe"; exit 1; }
          ASSET_NAME="ios-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip"
          cd "$RELEASE_DIR"
          7z a "../../../$ASSET_NAME" ios.exe
          cd ../../..
          echo "CLI_ASSET=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Unpack-verify CLI archive
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar xzf "$CLI_ASSET" -C "$VERIFY_DIR"
            BIN="$VERIFY_DIR/ios"
          else
            7z x "-o$VERIFY_DIR" "$CLI_ASSET" -y > /dev/null
            BIN="$VERIFY_DIR/ios.exe"
          fi
          [ -s "$BIN" ] || { echo "::error::CLI binary missing after unpack: $BIN"; exit 1; }
          "$BIN" --version
          "$BIN" --help > /dev/null
          rm -rf "$VERIFY_DIR"
          bash scripts/write-sha256.sh "$CLI_ASSET" "$CLI_ASSET.sha256"

      - name: Package and smoke FFI library (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="target/${{ matrix.target }}/release"
          LIB_SHARED="libios_ffi.${{ matrix.lib_ext }}"
          LIB_STATIC="libios_ffi.a"
          HEADER="crates/ios-ffi/include/ios_rs.h"
          for f in "$RELEASE_DIR/$LIB_SHARED" "$RELEASE_DIR/$LIB_STATIC" "$HEADER"; do
            [ -s "$f" ] || { echo "::error::FFI file missing or empty: target=${{ matrix.target }} expected=$f"; exit 1; }
          done
          FFI_ASSET="ios-ffi-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          mkdir -p _ffi_pkg
          cp "$RELEASE_DIR/$LIB_SHARED" "$RELEASE_DIR/$LIB_STATIC" "$HEADER" _ffi_pkg/
          if [ "${{ matrix.lib_ext }}" = "dylib" ]; then
            # Make the packaged dylib relocatable before creating the archive;
            # changing only the smoke copy would hide a broken release asset.
            install_name_tool -id "@loader_path/libios_ffi.dylib" "_ffi_pkg/$LIB_SHARED"
            # Re-sign the modified Mach-O bytes without a signing identity.
            # The archive and smoke must contain the same loadable dylib.
            codesign --force --sign - "_ffi_pkg/$LIB_SHARED"
            codesign --verify --strict "_ffi_pkg/$LIB_SHARED"
          fi
          tar czf "$FFI_ASSET" -C _ffi_pkg .
          echo "FFI_ASSET=$FFI_ASSET" >> "$GITHUB_ENV"

          # Verify the files in the archive itself. Checking only the source
          # paths would allow a packaging typo to pass while producing a
          # broken release asset.
          SMOKE_DIR="$(mktemp -d)"
          tar xzf "$FFI_ASSET" -C "$SMOKE_DIR"
          for f in "$SMOKE_DIR/$LIB_SHARED" "$SMOKE_DIR/$LIB_STATIC" "$SMOKE_DIR/ios_rs.h"; do
            [ -s "$f" ] || { echo "::error::FFI archive missing or empty after unpack: $f"; exit 1; }
          done
          AR_MEMBERS="$(mktemp)"
          ar t "$SMOKE_DIR/$LIB_STATIC" > "$AR_MEMBERS"
          [ -s "$AR_MEMBERS" ] || { echo "::error::FFI static archive has no members: $SMOKE_DIR/$LIB_STATIC"; exit 1; }

          # Device-free C smoke against the unpacked package: header, symbol
          # resolution, dynamic linking, and the safe null-parameter contract.
          cat > "$SMOKE_DIR/smoke.c" <<'EOF'
          #include <stdio.h>
          #include "ios_rs.h"

          int main(void) {
              /* Freeing NULL must be a no-op. */
              ios_free_string(NULL);
              /* Null out-params must be rejected without touching the device. */
              if (ios_list_devices(NULL, NULL) == 0) {
                  fprintf(stderr, "ios_list_devices(NULL, NULL) must return non-zero\n");
                  return 1;
              }
              /* Closing NULL handles must be a no-op, not a crash. */
              ios_device_close(NULL);
              ios_tunnel_close(NULL);
              return 0;
          }
          EOF
          CC_BIN="${CC:-}"
          if [ -z "$CC_BIN" ]; then
            if command -v cc > /dev/null 2>&1; then CC_BIN=cc
            elif command -v gcc > /dev/null 2>&1; then CC_BIN=gcc
            elif command -v clang > /dev/null 2>&1; then CC_BIN=clang
            else echo "::error::no C compiler found on runner"; exit 1
            fi
          fi
          echo "FFI C smoke compiler: $CC_BIN (${{ matrix.target }})"
          # Dynamic loading must resolve ONLY through the unpacked directory:
          # Linux via $ORIGIN rpath, macOS via the packaged @loader_path id.
          if [ "${{ matrix.lib_ext }}" = "dylib" ]; then
            RPATH_FLAGS=""
          else
            RPATH_FLAGS="-Wl,-rpath,\$ORIGIN"
          fi
          "$CC_BIN" -I"$SMOKE_DIR" "$SMOKE_DIR/smoke.c" $RPATH_FLAGS \
            "$SMOKE_DIR/$LIB_SHARED" -o "$SMOKE_DIR/smoke"
          "$SMOKE_DIR/smoke"
          bash scripts/write-sha256.sh "$FFI_ASSET" "$FFI_ASSET.sha256"
          echo "FFI C smoke (dynamic link + run) OK: ${{ matrix.target }}"

      - name: Package and smoke FFI library (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="target/${{ matrix.target }}/release"
          # MSVC outputs: import lib (ios_ffi.dll.lib) vs static lib (ios_ffi.lib).
          for f in "$RELEASE_DIR/ios_ffi.dll" "$RELEASE_DIR/ios_ffi.dll.lib" "$RELEASE_DIR/ios_ffi.lib" "crates/ios-ffi/include/ios_rs.h"; do
            [ -s "$f" ] || { echo "::error::FFI file missing or empty: target=${{ matrix.target }} expected=$f"; exit 1; }
          done
          FFI_ASSET="ios-ffi-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip"
          mkdir -p _ffi_pkg
          cp "$RELEASE_DIR/ios_ffi.dll" "$RELEASE_DIR/ios_ffi.dll.lib" "$RELEASE_DIR/ios_ffi.lib" "crates/ios-ffi/include/ios_rs.h" _ffi_pkg/
          cd _ffi_pkg
          7z a "../$FFI_ASSET" .
          cd ..
          echo "FFI_ASSET=$FFI_ASSET" >> "$GITHUB_ENV"

          SMOKE_DIR="$(mktemp -d)"
          SMOKE_DIR_WIN="$(cygpath -w "$SMOKE_DIR")"
          7z x "-o$SMOKE_DIR" "$FFI_ASSET" -y > /dev/null
          for f in "$SMOKE_DIR/ios_ffi.dll" "$SMOKE_DIR/ios_ffi.dll.lib" "$SMOKE_DIR/ios_ffi.lib" "$SMOKE_DIR/ios_rs.h"; do
            [ -s "$f" ] || { echo "::error::FFI archive missing or empty after unpack: $f"; exit 1; }
          done
          cat > "$SMOKE_DIR/smoke.c" <<'EOF'
          #include <stdio.h>
          #include "ios_rs.h"

          int main(void) {
              ios_free_string(NULL);
              if (ios_list_devices(NULL, NULL) == 0) {
                  fprintf(stderr, "ios_list_devices(NULL, NULL) must return non-zero\n");
                  return 1;
              }
              ios_device_close(NULL);
              ios_tunnel_close(NULL);
              return 0;
          }
          EOF
          VSWHERE="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          if [ -f "$VSWHERE" ]; then
            # Keep the clang fallback reachable on images without VSwhere or
            # without the requested MSVC component.
            VSDIR="$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>/dev/null | head -1 | tr -d '\r' || true)"
          else
            VSDIR=""
          fi
          if [ -n "$VSDIR" ] && [ -f "$VSDIR/VC/Auxiliary/Build/vcvars64.bat" ]; then
            echo "FFI C smoke compiler: MSVC cl.exe via vcvars64 (${{ matrix.target }})"
            cat > "$SMOKE_DIR/build_smoke.bat" <<EOF
          @echo off
          call "$(cygpath -w "$VSDIR")\\VC\\Auxiliary\\Build\\vcvars64.bat"
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          cl /nologo /utf-8 /I"$SMOKE_DIR_WIN" "$SMOKE_DIR_WIN\\smoke.c" /link /LIBPATH:"$SMOKE_DIR_WIN" "$SMOKE_DIR_WIN\\ios_ffi.dll.lib" /OUT:"$SMOKE_DIR_WIN\\smoke.exe"
          if errorlevel 1 exit /b 1
          "$SMOKE_DIR_WIN\\smoke.exe"
          EOF
            cmd //c "$(cygpath -w "$SMOKE_DIR")\\build_smoke.bat"
          else
            echo "FFI C smoke compiler: clang (MSVC not found; using compatible ABI)"
            command -v clang >/dev/null 2>&1 || { echo "::error::neither MSVC nor clang is available"; exit 1; }
            clang -I"$SMOKE_DIR" "$SMOKE_DIR/smoke.c" "$SMOKE_DIR/ios_ffi.dll.lib" -o "$SMOKE_DIR/smoke.exe"
            "$SMOKE_DIR/smoke.exe"
          fi
          bash scripts/write-sha256.sh "$FFI_ASSET" "$FFI_ASSET.sha256"
          echo "FFI C smoke (dynamic link + run) OK: ${{ matrix.target }}"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.CLI_ASSET }}
            ${{ env.CLI_ASSET }}.sha256
            ${{ env.FFI_ASSET }}
            ${{ env.FFI_ASSET }}.sha256

  # ── Python wheels (maturin) ──────────────────────────────────────────────────

  python-wheels:
    name: Python wheels (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, feature-check, msrv, build-and-test, python-smoke, validate-tag]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            wheel_platform: manylinux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            wheel_platform: manylinux-aarch64
          - target: aarch64-apple-darwin
            runner: macos-latest
            wheel_platform: macos-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            wheel_platform: win-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev headers (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg install openssl:x64-windows-static-md

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: python-${{ matrix.target }}
          cache-bin: false

      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/*.whl
          cd crates/ios-py
          uvx maturin build --release --target ${{ matrix.target }} --out ../../dist
          cd ../..
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel for ${{ matrix.target }}, found ${#WHEELS[@]}"
            printf '  %s\n' "${WHEELS[@]}"
            exit 1
          fi
          WHEEL_FILE="${WHEELS[0]}"
          [ -s "$WHEEL_FILE" ] || { echo "::error::wheel missing or empty: $WHEEL_FILE"; exit 1; }
          WHEEL_NAME="$(basename "$WHEEL_FILE")"
          WHEEL_PLATFORM_OK=0
          case "${{ matrix.wheel_platform }}" in
            manylinux-x86_64) if [[ "$WHEEL_NAME" == *manylinux*x86_64.whl ]]; then WHEEL_PLATFORM_OK=1; fi ;;
            manylinux-aarch64) if [[ "$WHEEL_NAME" == *manylinux*aarch64.whl ]]; then WHEEL_PLATFORM_OK=1; fi ;;
            macos-arm64) if [[ "$WHEEL_NAME" == *macosx*arm64.whl ]]; then WHEEL_PLATFORM_OK=1; fi ;;
            win-amd64) if [[ "$WHEEL_NAME" == *win_amd64.whl ]]; then WHEEL_PLATFORM_OK=1; fi ;;
            *) echo "::error::unknown wheel platform marker: ${{ matrix.wheel_platform }}"; exit 1 ;;
          esac
          [ "$WHEEL_PLATFORM_OK" -eq 1 ] || { echo "::error::wheel $WHEEL_NAME does not carry target platform ${{ matrix.wheel_platform }}"; exit 1; }
          echo "Built wheel: $WHEEL_FILE ($(wc -c < "$WHEEL_FILE") bytes)"
          echo "WHEEL_FILE=$WHEEL_FILE" >> "$GITHUB_ENV"

      - name: Smoke wheel in clean venv (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python "$WHEEL_FILE"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          "$GITHUB_WORKSPACE/.smoke-venv/bin/python" - <<'PY'
          import ios_rs

          assert callable(ios_rs.list_devices)
          try:
              ios_rs.start_tunnel("no-such-device", mode="invalid")
          except ValueError as exc:
              message = str(exc)
              assert "userspace" in message and "kernel" in message, message
          else:
              raise AssertionError("invalid tunnel mode must raise ValueError")
          print("wheel smoke OK: import, callable, invalid-mode ValueError")
          PY

      - name: Smoke wheel in clean venv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python "$WHEEL_FILE"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          "$GITHUB_WORKSPACE/.smoke-venv/bin/python" - <<'PY'
          import ios_rs

          assert callable(ios_rs.list_devices)
          try:
              ios_rs.start_tunnel("no-such-device", mode="invalid")
          except ValueError as exc:
              message = str(exc)
              assert "userspace" in message and "kernel" in message, message
          else:
              raise AssertionError("invalid tunnel mode must raise ValueError")
          print("wheel smoke OK: import, callable, invalid-mode ValueError")
          PY

      - name: Smoke wheel in clean venv (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/Scripts/python.exe "$WHEEL_FILE"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          "$GITHUB_WORKSPACE/.smoke-venv/Scripts/python.exe" - <<'PY'
          import ios_rs

          assert callable(ios_rs.list_devices)
          try:
              ios_rs.start_tunnel("no-such-device", mode="invalid")
          except ValueError as exc:
              message = str(exc)
              assert "userspace" in message and "kernel" in message, message
          else:
              raise AssertionError("invalid tunnel mode must raise ValueError")
          print("wheel smoke OK: import, callable, invalid-mode ValueError")
          PY

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  python-sdist:
    name: Python sdist
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, feature-check, msrv, build-and-test, validate-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/*.tar.gz
          cd crates/ios-py
          uvx maturin sdist --out ../../dist
          cd ../..
          shopt -s nullglob
          SDISTS=(dist/*.tar.gz)
          if [ "${#SDISTS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one sdist, found ${#SDISTS[@]}"
            printf '  %s\n' "${SDISTS[@]}"
            exit 1
          fi
          SDIST_FILE="${SDISTS[0]}"
          [ -s "$SDIST_FILE" ] || { echo "::error::sdist missing or empty: $SDIST_FILE"; exit 1; }
          echo "Built sdist: $SDIST_FILE ($(wc -c < "$SDIST_FILE") bytes)"
          echo "SDIST_FILE=$SDIST_FILE" >> "$GITHUB_ENV"

      - name: Inspect sdist archive
        shell: bash
        run: |
          set -euo pipefail
          SDIST_CONTENTS="$(mktemp)"
          tar -tzf "$SDIST_FILE" > "$SDIST_CONTENTS"
          for pattern in 'pyproject\.toml$' 'Cargo\.toml$' 'Cargo\.lock$' 'src/lib\.rs$'; do
            grep -E "$pattern" "$SDIST_CONTENTS" > /dev/null \
              || { echo "::error::sdist missing required file matching $pattern"; exit 1; }
          done
          echo "sdist contents (first 20 entries):"
          head -20 "$SDIST_CONTENTS"
          # Note: standalone sdist installation (with build isolation) is not
          # exercised here; wheel artifact smoke covers binding installability.

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

  publish-crates:
    name: Publish to Crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, feature-check, msrv, build-and-test, validate-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh
